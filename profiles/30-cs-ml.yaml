    brief: 把生成样例/注意力图/失败案例拼成投稿图版，选样依据可核。
    ac:
      - "`{fig}/composite/` 下各图版的拼接几何（行列数、留白、缩放比例）与 `{fig}/40-figure-specs.md` 一致。"
      - "每格标注样本 ID 与选择依据，不得静默挑好看样例；被排除样例写明排除理由。"
      - "不做色彩美化（除必要的亮度统一并注明），不得改变原始输出的可比性。"
    inject: [representative_selection, missing_data]
    read: [{path: "{data}", priority: must_read, hint: 原始输出件}, {path: "{fig}/40-figure-specs.md", priority: must_read, hint: 版式规格}]
    edit: ["{fig}/composite/fig-qualitative-grid.png", "{tool_dir}/74-compose-plates.py"]
    hours: 3
    difficulty: medium
    verify: "python {verify_tool} task-compose-raster-figures"

  # ── P5 合稿与审计 ──────────────────────────────────────────────────────────────
  - id: task-assemble-draft
    module: mod-draft
    stage: P5
    name: 合稿与参考文献
    brief: 用确定性脚本合稿，出编号制文献表并做自检。
    ac:
      - "`{ms}/36-draft.md` 按骨架顺序合并摘要、各节正文、图注与表格，图注编号 Fig.1..N 唯一且连续。"
      - "`{ms}/37-references.md` 只列正文实际引用的编号，升序无重号，每条含 authors/title/journal/year/DOI。"
      - "正文零占位符：所有面向作者的待确认项上收为单一清单（含 `{admin}/09-reproducibility.md` 的待确认行），正文不得残留标记或面向作者的说明块。"
      - "`{tool_dir}/72-assemble-draft.py` 幂等：同一输入字节一致；正文字数落在 `{admin}/01-meta.json` 的预算区间。"
    read: [{path: "{admin}/02-skeleton.md", priority: must_read, hint: 顺序与预算}, {path: "{ms}/sections", priority: must_read, hint: 各节正文}, {path: "{lit}/22-refs.json", priority: must_read, hint: 文献表来源}, {path: "{admin}/09-reproducibility.md", priority: must_read, hint: 待确认项上收清单}]
    edit: ["{ms}/36-draft.md", "{ms}/37-references.md", "{tool_dir}/72-assemble-draft.py", "{verify_manifest}"]
    hours: 2.5
    difficulty: medium
    verify: "python {verify_tool} task-assemble-draft"

  - id: task-citation-audit
    module: mod-lit
    stage: P5
    name: 引用覆盖审计
    brief: 逐条核对已引文献与正文断言，给出判定与判据级别。
    ac:
      - "`{lit}/25-citation-audit.md` 逐条列出全部已引编号的位置、判定（支持/部分支持/不支持）与判据级别（全文页/题录级/未核）。"
      - "无全文的条目必须显式标注为未核；若某条未核条目进入结果与讨论，须在此显式列出并说明其支撑与哪些已有引用重叠。"
      - "不支持项按三选一处置（替换文献 / 降级措辞 / 删除断言），并在文件内留改动前后文本痕迹。"
      - "未引文献三档判定（该引/留 future/剔除）覆盖库中全部未引条目。"
      - "统计自引比例（作者姓氏在已引文献作者列表中重复出现者）；超过 20% 时逐条列出并说明理由，不得静默保留。"
      - "作为 baseline 数值出处的引用必须给出该文献的表号与页码；正文引用他方数值而本稿未回到原文核对者，判定不得高于部分支持。"
    inject: [baseline_provenance]
    ac_exception: true            # 6 条产物 AC + 1 条原文核对口径（引用判定必须与 baseline 出处绑定）
    read: [{path: "{ms}/36-draft.md", priority: must_read, hint: 正文断言}, {path: "{lit}/22-refs.json", priority: must_read, hint: 库与全文状态}, {path: "{lit}/20-claims-map.md", priority: must_read, hint: claim-证据对应}, {path: "{lit}/24-fulltext-inventory.md", priority: must_read, hint: 可得性分层}]
    edit: ["{lit}/25-citation-audit.md", "{verify_manifest}"]
    hours: 4
    difficulty: high
    verify: "python {verify_tool} task-citation-audit"

  # ── P6 终局 ────────────────────────────────────────────────────────────────────
  - id: task-presubmit-review
    module: mod-final
    stage: P6
    name: 投稿前评审
    brief: 六层评审整稿，出分级问题清单与明确投稿结论。
    ac:
      - "`{review}/50-review-report.md` 按六层（论证链/claim-证据/新颖性与文献复核/语言与 AI 腔/图表规范/实验完整性与对照与方差）逐层给结论。"
      - "问题分级 CRITICAL/MAJOR/MINOR 且定位到原文（章节+句子或图表号），每条给出修法。"
      - "核对正文数值与 `{data}/11-analysis.md`、`{data}/14-table-ablations.md` 的均值、标准差与分母一致，并核对复现六要素缺项已全部处置。"
      - "给出目标刊适配风险与明确结论（可投 / 小修后投 / 需大改 / 不建议投）。"
      - "代码来源、随机种子清单或数据划分版本缺项且未以待确认呈现时判为 CRITICAL（可复现性合规项，不因文字流畅降级）。"
    inject: [forbidden_claims, reproducibility_statement]
    ac_exception: true            # 5 条产物 AC + 2 条域口径注入（复现要素状态与禁用断言都是评审判 CRITICAL 的依据）
    read: [{path: "{ms}/36-draft.md", priority: must_read, hint: 受审稿}, {path: "{admin}/09-reproducibility.md", priority: must_read, hint: 六要素状态与待确认项（判 CRITICAL 的比对对象）}, {path: "{data}/14-table-ablations.md", priority: must_read, hint: 消融覆盖}, {path: "{ms}/37-references.md", priority: must_read, hint: 文献表}, {path: "{data}/11-analysis.md", priority: must_read, hint: 数据事实}, {path: "{admin}/03-journal-selection.md", priority: must_read, hint: 目标刊要求}]
    edit: ["{review}/50-review-report.md"]
    hours: 3
    difficulty: high
    verify: "python {verify_tool} task-presubmit-review"

  - id: task-finalize-manuscript
    module: mod-final
    stage: P6
    name: 按评审定稿
    brief: 按评审意见定稿，产出零占位符终稿与响应说明。
    ac:
      - "`{ms}/38-final.md` 落实评审报告中全部 CRITICAL/MAJOR 项，并在 `{review}/51-response-to-review.md` 逐条给处置与依据。"
      - "终稿零占位符：无标记、无 TODO/TBD、无面向作者的说明块；未确认的复现要素按 `{admin}/09-reproducibility.md` 的待确认口径统一上收为作者待办清单，不在正文留悬空句。"
      - "定稿只改陈述与措辞，不改任何结果数值；数值变更须回到 `{data}/11-analysis.md` 与 `{data}/10-audit.md` 并说明。"
    read: [{path: "{review}/50-review-report.md", priority: must_read, hint: 评审问题清单}, {path: "{admin}/09-reproducibility.md", priority: must_read, hint: 待确认口径上收依据}, {path: "{ms}/36-draft.md", priority: must_read, hint: 待改稿}, {path: "{ms}/37-references.md", priority: must_read, hint: 文献表}]
    edit: ["{ms}/38-final.md", "{review}/51-response-to-review.md"]
    hours: 3.5
    difficulty: medium
    verify: "python {verify_tool} task-finalize-manuscript"

  - id: task-latex-build
    module: mod-final
    stage: P6
    name: LaTeX 排版构建
    brief: 按目标刊模板生成 tex 并构建 PDF，回读校验。
    ac:
      - "`{latex}/manuscript/manuscript.tex` 由终稿生成，文件头标注 GENERATED 且不得手工改写内容。"
      - "`{latex}/manuscript/refs.bib` 与 `{ms}/37-references.md` 的编号一一对应，无悬空引用。"
      - "构建产物 PDF 的页数、图数、表数与终稿一致，引用编号连续无缺号；构建脚本 `{latex}/build_paper.ps1` 可复跑。"
      - "可复现性清单与消融表、补充材料按目标刊要求随件构建，主件 PDF 的图表编号与正文引用一致。"
    read: [{path: "{ms}/38-final.md", priority: must_read, hint: 终稿真源}, {path: "{ms}/37-references.md", priority: must_read, hint: 文献表}, {path: "{data}/14-table-ablations.md", priority: reference, hint: 补充材料与消融口径}, {path: "{admin}/09-reproducibility.md", priority: must_read, hint: "可复现性清单真源（本任务 AC 末条要求随件构建的输入）"}, {path: "{fig}/", priority: must_read, hint: 图件}]
    edit: ["{latex}/manuscript/manuscript.tex", "{latex}/manuscript/refs.bib", "{latex}/build_paper.ps1"]
    hours: 4
    difficulty: medium
    verify: "python {verify_tool} task-latex-build"

  # 基类任务：只追加本域口径，不重写 AC（deep_merge 对同 id 的 inject 做追加合并）
  - id: task-back-matter
    inject: [reproducibility_statement, reporting_standard]
