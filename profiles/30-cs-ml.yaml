    ac_exception: true          # 5 条产物 AC + 3 条域口径：六要素须逐要素成行（合并即让缺项静默消失）；domain_checklist 给许可口径出处，算力口径由 baseline_required 与实现节 AC 承载，不入本任务 files 断言
    read: [{path: "{data}/raw", priority: must_read, hint: 配置文件、脚本与运行日志}, {path: "{data}/10-audit.md", priority: must_read, hint: 已核对的运行与口径}]
    edit: ["{admin}/09-reproducibility.md"]
    hours: 2.5
    difficulty: medium
    verify: "python {verify_tool} task-declare-reproducibility"

