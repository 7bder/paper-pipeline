# 领域档：计算机科学与机器学习（实验型研究：模型/系统/数据的量化比较）
# 生成器：scripts/30-gen-proposals.py。本档与 00-base-empirical.yaml 的关系＝CS/ML 学科差异，
# 通用口径（baseline 参照系 / n 披露 / raw-vs-processed / 坐标轴完整性 / 后页声明）一律继承。
# 本档相对材料档的三处 CS/ML 加严（任务卡 AC 的来源）：
#   1) baseline 原文核对（page-level）：他方报告的数值必须回到**原文表号/页码**逐条核对，
#      本文复现值与他方报告值不一致者登记为缺口，不得改写他方数值以对齐自家结果；
#   2) 复现声明：代码来源、运行环境、超参搜索空间与预算、随机种子清单、数据划分版本、
#      指标实现出处必须逐条编号登记，并以「待确认项：…」固定收口行声明有无缺失
#      （要素齐备写「待确认项：无」），不以「不写这行」的方式静默省略；
#   3) 多种子方差与消融披露：进入结论的指标必须报 mean ± std 与种子数，主图必须画误差棒；
#      每个主张为贡献的模块必须有消融行（含标准差），并把该口径注入方法学与结果段落。
#
# 与 10-materials-chemistry.yaml / 10-clinical.yaml 的分工（改本档前先读 scripts/78-assertions-selftest.py 的守卫）：
#   · 链条任务（核对/需求单/检索筛选/双库验真/全文盘点/选刊/引言/结果讨论/结论摘要/合稿/引用审计/
#     评审/定稿/排版/后页，与 15 个交集 id 一一对应，共 15 个）
#     的**断言块逐字沿用**材料档——78 号「共有任务断言同源」守卫逼的就是这条一致性，
#     断言是"领域无关的结构性下限"，学科差异全部体现在 AC 文本里；
#   · 断言在 CS/ML 不成立的四类任务**处置并不相同**（与材料档同 id 即被 78 号守卫 3 判为"断言必须
#     逐字相同"，改不动判据只能换 id）：2 类**另起 id**（analyze-data→analyze-baselines、
#     write-experimental→write-implementation）；2 类**整块删除**（无 SEM/TEM 图版摄入、无图版-骨架
#     同步，本域无对应产物，故不配新 id）；另有 2 个本域新增任务（declare-reproducibility、
#     tabulate-ablations）不属这四类，是"材料档没有、本域必须有"。
#     `verify_assertions_template` 是 list 而 deep_merge 对 list 整体替换 ⇒ 断言只能整块重写、无按任务合并；
#   · 任务 id 与材料档的集合差 = 8（去掉 4 个材料特有、新增 4 个本域特有），口径是**生成物与合并视图**
#     （`--out build/csml` 展开 24 份 vs 材料档 24 份，对称差实测 8），AC4 的上限按此核对；
#     若只比两档文件自身 `tasks:` 列表则是 9——本档多一条**只补 `inject`**（reproducibility_statement、
#     reporting_standard）的 `task-back-matter` 覆盖声明，而 `tasks:` 段按 id 合并、基类那条仍在，
#     生成物层面两档都含 back-matter，差回落到 8；
#     **余量为 0**：8 个差集里 4 个来自改名（analyze-data→analyze-baselines、
#     write-experimental→write-implementation），任何再次改名都直接计入差集并破 AC4，
#     要改 id 必须先扩 AC4 上限或合并任务（2026-09-27 spec 审查 MINOR-4）；
#   · 本档 verify_assertions_template 的**实质断言任务数固定为 20**：78 号既是棘轮下限
#     （<20 判失败），反向对照又取"实质任务最多的档"做基线并要求"删一条即跌破下限"
#     （>20 会让该档 21 条反向对照全红）；取样档用严格 `>` 比较，四档并列 20 时按文件名排序落在
#     10-clinical，本档加到 21 才会成为取样档。三个图件任务只由通配（存在性 + 体积下限）覆盖，
#     与材料档的 redraw/draw-schematics/compose-raster 同构。
#   · 不得声明顶层 `fragments:` 键——75 号有"真实档未提前声明 fragments"守卫（零回归基线）。
#   · citation_policy.discovery_sources 只准写 `35-refs-gate.py:69` 的 INDICES 四家
#     （openalex / crossref / semantic_scholar / arxiv）；dblp 等未实现源不得声明（声明即空头能力）。
#
# 本档已知、但**不在本任务声明面内**的六处外部约束（2026-09-27 spec 审查三/四轮登记，待 idea 落地）：
#   1) 数值形态（小数 + ±、同一行多列）写不成 contains_regex/min_matches：78 号的可满足性探针
#      PROBES（scripts/78-assertions-selftest.py:57-58）没有小数与带符号样本，此类正则一律被拒。
#      本档因此只能在探针放行的 `\d`、`\|`、`^\|`、`^\|\s*\d+`、`Fig\. ?\d+` 五类形态内设形体下限
#      （见模板段落注释）；要真正机检"每格都是 mean ± std"须先给 PROBES 补 "| 1 | 0.81 ± 0.02 |" 类样本。
#   2) task-select-journal 的 token 分区/开放获取/版面 逐字继承自材料档，而该 id 落在 78 号四档
#      交集内（单档改即破同源守卫），对以会议为主要目标的 CS/ML 属错配判据，须四档同改。
#   3) 各节 word_count 上界之和 14750（2000+8000+350+900+3500，即 31/33/30/34/32 五节）> 继承的
#      `36-draft [3000,12000]`；draft 断言同在交集内，
#      本档单改不能根治。
#   4) 计数原语没有"按列 / 按行 / 唯一性"语义：`min_matches` 走 len(re.findall(...))
#      （scripts/70-verify.py:151），整列复制同一数值、每格填无意义数字串、同一条 Fig. 1 复制
#      四行、620 词凑 word_count 的填充在计数上与合规产物不可区分——对抗实测 12 例填充中 10 例
#      rc=0（M-03/M-04/M-06/M-07/M-08/M-08b/M-09/M-10 与 M-05/M-05b；后两例是"谎称已满足"的空壳，
#      其数字位与"全部未满足"的诚实登记同一量级（实测 18~24），计数原语分不开二者），本档只能靠 AC
#      文本 + 人工审查拦这类形态，需要新原语（如 count_distinct / 逐行分列匹配）才能机检。
#   5) 收口行的行首契约无机检：`^待确认项` 这类以中文为锚点的正则命中不了任何 PROBES（探针样本
#      全 ASCII），contains 只认子串，故「待确认项」写成表行也过。同样须先给 PROBES 补中文样本。
#   6) 继承面（与材料档逐字同源、单档改即破 78 号守卫 3）另有四处形态/阈值越权，实测均误杀，
#      须四档同改：task-citation-audit 的 `^\|\s*\d+`（首列直接放引用号 `[12]` 的合规表命中 0）、
#      task-write-results-discussion 的 `Fig\.\s*\d+`（ACM 惯例全称 `Figure 1` 被杀，AC 未规定缩写）、
#      task-assemble-draft 的 `\*\*Fig\. \d+\.\*\*`（按 AC 字面写 `**Fig.1.**` 无空格即被杀）、
#      task-presubmit-review 的 `CRITICAL|MAJOR|MINOR` ≥10（干净稿问题不足 10 条即被杀，AC 无条数）。
extends: 00-base-empirical.yaml
id: cs-ml
version: "1"
title: 计算机科学与机器学习实验型研究论文
tool_dir: 70-tools
verify_tool: 70-tools/70-verify.py
verify_manifest: 70-tools/71-verify-manifest.json

project:
  name: cs-ml-research-paper
  brief: 基于既有实验数据（训练日志、评测脚本输出、消融运行记录）的 CS/ML 研究论文，按 orchd 任务链产出可投稿英文稿件。
  review_mode: unified

axes:
  paper_type: research-article
  evidence_form: computational-study
  publisher: acm
  language: en
  reporting: [reproducibility-checklist]   # 可复现性清单轴值：由 evidence_policy.reporting_standard 消费

# 模块定义与依赖图锚点全部继承基类（mod-data / mod-lit / mod-draft / mod-fig / mod-final）。
paths:
  admin: 00-admin
  data: 10-data
  lit: 20-lit
  ms: 30-manuscript
  fig: 40-figures
  review: 50-review
  latex: 60-latex
  nb: 90-notebooks

# CS/ML 口径：继承基类的通用键，覆盖与实验型计算冲突者，并新增本档特有的六键。
# 注意：这些值**不做占位符替换**（生成器只替换任务规格），故路径一律写字面量，
# 且不得残留花括号——78 号有「rules.fragment 无未解析占位符」守卫。
evidence_policy:
  # 覆盖基类占位版 unit_source（基类故意写 {data}，漏覆盖即生成物留脏）
  unit_source: "唯一数据源 = 项目 10-data/（训练日志、评测输出、指标导出，含 .provenance 与运行清单），不得引入项目外数据、不得把他方论文表格里的数值当作本稿实验结果陈述"
  hedging_required: ["单次运行推出的稳定性", "由消融推出的机制归因", "在子集或子任务上的提升外推到全量", "未做统计检验的'显著优于'"]
  baseline_required: "每条性能 claim 必须写明对照（哪一条 baseline、其实现来源、其原文报告值）与比较口径（同数据划分、同指标实现、同算力预算与否）；无参照系的'提升/优于/最优'措辞禁止，跨协议比较只能写成 comparable under protocol X"
  seed_variance: "进入结论的每个指标必须披露随机种子数与 mean ± std（或中位数与极值）；只报最优一次运行、或只报单次运行的表格与图，判为未报告方差；种子数 <3 者显式登记为缺口（G 编号）并说明代价"
  baseline_provenance: "baseline 原文核对（page-level）：10-data/11-analysis.md 逐行给 方法名、指标、他方原文报告值、原文表号与页码、本稿复现值、mean ± std、偏差判定；与原文不一致或与本稿划分不可比者以 G 编号登记缺口，不得改写原文数值以对齐自家结果"
  reproducibility_statement: "复现声明六要素逐条登记：代码来源（仓库与 commit 或随稿附件）、运行环境（框架/版本/驱动）、超参数（搜索空间、采样方式、选定值与搜索预算）、随机种子清单、数据划分与版本（含许可与获取日期）、指标实现出处（自实现或引用他方脚本）。缺失者以「待确认项：<项目>：需谁提供什么」行呈现，六要素齐备时以「待确认项：无」收口，该收口行不得整句省略"
  ablation_required: "每个被主张为贡献的模块必须有对应消融行：10-data/14-table-ablations.md 逐行给 配置、指标、mean ± std、变化方向与支撑的 claim 编号；未做消融的贡献不得进入结论与摘要"
  n_disclosure: "每个定量结果披露 数据集与划分的样本数（train/val/test）、迭代数、评测次数与种子数；单次测量图注必须写'representative result, single run'，不得省略"
  raw_vs_processed: "provenance 必须区分日志原始指标值与处理/择优值（最后 k 步均值、跨种子聚合、去掉离群运行）；派生值写明聚合方式与脚本"
  statistical_wording: "无多种子方差或未做检验的图与正文，禁止 significantly/outperforms/superior/greatly/consistently better；声称优于他方须给差值、标准差与检验（或显式写明未做检验）"
  axis_integrity: "纵轴不得截断夸大差异；不从零起必须在图注显式说明；主比较图的每个数据点必须带误差棒或写明该点为单次运行"
  method_citation: "每个复现的方法/模型须引用其原文并标注实现来源（官方代码/自实现），具体条目清单见本档 domain_checklist"
  representative_selection: "定性图版（注意力图、生成样例、失败案例）必须写明样本选择依据（第几号样本、按何条件入选），不得静默挑好看样本"
  missing_data: "缺失运行与未跑完的消融不补点、不外推；图件与正文均须显式标注该缺口并按 G 编号登记"
  domain_checklist:
    - "数据集须给版本、许可、获取日期与划分口径（官方划分或自建划分），自建划分给切分脚本与随机种子"
    - "复现的每个 baseline 须给原文报告值与出处（表号 + 页码）、实现来源（官方/自实现）与超参搜索预算"
    - "超参数给搜索空间、搜索方式（网格/随机/贝叶斯）、试验次数与最终选定值；学习率、批大小、训练轮数不得只写“经验设置”"
    - "算力与运行成本给硬件型号、卡数、单卡显存与总 GPU-hours；效率类结论必须与算力口径同段落披露"
    - "代码与权重可得性给出显式声明（公开仓库地址、随稿附件、或说明不提供的原因）"
    - "指标实现给来源（官方评测脚本/自实现）与他方数值一致性核对"
  reporting_standard: "可复现性清单按 axes.reporting 声明执行（reproducibility-checklist）：逐条给 状态（已满足 / 未满足 / 不适用）+ 正文定位（节 + 页或表图号）+ 未满足项的修法；不适用项须写明理由，不得整片留空"
  forbidden_claims: ["首次/突破/最优/全局最优/SOTA", "未经消融支持的机制归因", "单次运行称稳定或一致", "未经同协议比较的效率或泛化结论", "未测硬件条件下的运行时间类断言"]

figure_policy:
  vector_data_figures: true
  raster_composites: true        # 定性对比图版（生成样例/注意力图/失败案例网格）；纯表格类子领域删本任务并置 false
  caption_must_state: ["种子数与误差棒口径（mean ± std 的聚合方式）", "每条 baseline 的实现来源与原文出处", "缺失运行不补点", "坐标轴单位、是否截断与归一化口径"]

citation_policy:
  style: numbered
  discovery_sources: [openalex, crossref, semantic_scholar, arxiv]
  verification: { min_title_similarity: 0.70, require_journal_year_consistency: true, check_retraction: true }
  fulltext_gate: { mode: advisory, tristate: [verified, suspected, unresolvable] }
  audit_required: "逐条列出已引文献的位置、判定（支持/部分支持/不支持）与判据级别（全文页/题录级/未核）；作为 baseline 数值出处的文献单独标注其表号与页码，其判定不得低于全文页级"

# 实质断言共 20 个任务（棘轮下限与反向对照的共同要求，见文件头说明）。
# 三条硬约束由 scripts/78-assertions-selftest.py 机检：
#   ① path 写字面量（本块不做占位替换）；② path 落在该任务 files_to_edit ∪ files_to_read 内；
#   ③ json_files 用 require_keys* 必配 min_items（空列表 fail-open 已由 70-verify.py 拦，但守卫仍要求写明）。
verify_assertions_template:
  - task: "*"
    apply_to: edit_files_text
    forbid: ["AUTHOR CONFIRM", "TODO"]
    min_bytes: 200
  - task: "*"
    apply_to: edit_files_binary
    min_bytes_each: 5000   # 与材料档同源；5KB 只拦占位/坏文件、不误伤小矢量。"真实图件 ≥28KB"来自外部项目实测，本仓无图件工件可复测（出处为外部，不作本档判据依据）

  # ── 与 10-materials-chemistry.yaml 逐字同源链条的 15 条 ──────────────────────────
  - task: task-audit-data            # AC「缺口清单（G 编号）」「口径」「逐值核对」
    files:
      - path: 10-data/10-audit.md
        contains: ["核对", "缺口", "口径"]
        min_matches: { pattern: "G\\d+", min: 3 }
  - task: task-claim-map             # references/20 §2 字段表：claim_id=C-1…、evidence_strength、boundary、needs
    files:
      - path: 20-lit/20-claims-map.md
        contains: ["claim_id", "evidence_strength", "boundary", "needs"]
        min_matches: { pattern: "C-\\d+", min: 8 }
  - task: task-screen-existing-refs  # AC「逐条给出 keep/drop 与理由，覆盖既有库全部条目」
    files:
      - path: 20-lit/20-screening.md
        contains: ["keep", "drop"]
        min_matches: { pattern: "keep|drop", min: 20 }
  - task: task-search-verify-refs    # AC 字段清单 + references/30 §1 ② 验真判据（grade/two_source_verified/verify_checks）
    json_files:
      - path: 20-lit/21-candidates.json
        min_items: 20
        require_keys: ["title", "doi", "source", "verify_checks"]
      - path: 20-lit/22-refs.json
        min_items: 20
        require_keys_all: ["ref_no", "authors", "title", "journal", "year", "doi",
                           "grade", "verify_checks", "two_source_verified"]
  - task: task-lit-fulltext-inventory # AC「按可得性分层（机制承载 / 背景支撑 / 备选）」
    files:
      - path: 20-lit/24-fulltext-inventory.md
        contains: ["机制承载", "背景支撑", "备选"]
  - task: task-select-journal        # AC「影响因子/分区、版面与开放获取费用」
    files:
      - path: 00-admin/03-journal-selection.md
        contains: ["分区", "开放获取", "版面"]
  - task: task-write-introduction    # AC「背景类引用只出现在本节」+ references/20 §5 落位：本节必须有编号引用
    files:
      - path: 30-manuscript/sections/31-introduction.md
        word_count: [500, 2000]
        min_matches: { pattern: "\\[\\d+", min: 8 }
  - task: task-write-results-discussion # AC「按骨架的图表顺序推进，逐图逐表」
    files:
      - path: 30-manuscript/sections/33-results-discussion.md
        word_count: [2000, 8000]
        min_matches: { pattern: "Fig\\.\\s*\\d+", min: 8 }
  - task: task-write-conclusion-abstract # AC「摘要…无引用、无未定义缩写」「词数区间」
    files:
      - path: 30-manuscript/30-abstract.md
        word_count: [120, 350]
        forbid_regex: ["\\[\\d+\\s*[,\\]]"]
      - path: 30-manuscript/sections/34-conclusion.md
        word_count: [200, 900]
  - task: task-assemble-draft        # AC「图注编号 Fig.1..N 唯一且连续」「37 每条含 …DOI」
    files:
      - path: 30-manuscript/36-draft.md
        word_count: [3000, 12000]
        min_matches: { pattern: "\\*\\*Fig\\. \\d+\\.\\*\\*", min: 2 }
      - path: 30-manuscript/37-references.md
        contains: ["DOI"]
        min_matches: { pattern: "\\[\\d+\\]", min: 20 }
  - task: task-citation-audit        # AC「判定（支持/部分支持/不支持）与判据级别（全文页/题录级/未核）」
    files:
      - path: 20-lit/25-citation-audit.md
        contains: ["部分支持", "不支持", "未核"]
        min_matches: { pattern: "^\\|\\s*\\d+", min: 15 }
    json_files:      # 审计只对已引条目负责 → 库本身必须逐条字段完整
      - path: 20-lit/22-refs.json
        min_items: 20
        require_keys_all: ["ref_no", "authors", "title", "journal", "year", "doi",
                           "grade", "verify_checks", "two_source_verified", "local_pdf"]
  - task: task-presubmit-review      # AC「问题分级 CRITICAL/MAJOR/MINOR 且定位到原文」
    files:
      - path: 50-review/50-review-report.md
        contains: ["CRITICAL", "MAJOR", "MINOR"]
        min_matches: { pattern: "CRITICAL|MAJOR|MINOR", min: 10 }
  - task: task-finalize-manuscript   # AC「在 51-response-to-review.md 逐条给处置与依据」
    files:
      - path: 50-review/51-response-to-review.md
        contains: ["CRITICAL", "MAJOR"]
  - task: task-latex-build           # AC「文件头标注 GENERATED」「refs.bib 与 37 编号一一对应」
    files:
      - path: 60-latex/manuscript/manuscript.tex
        contains: ["GENERATED"]
      - path: 60-latex/manuscript/refs.bib
        min_matches: { pattern: "@[a-z]+\\{", min: 20 }
  - task: task-back-matter           # 基类 AC「CRediT 逐人映射 / Conflict of Interest / Data Availability Statement」
    files:
      - path: 30-manuscript/39-back-matter.md
        contains: ["CRediT", "Data Availability", "Conflict of Interest"]

  # ── CS/ML 特有 5 条 ─────────────────────────────────────────────────────────────
  # 同源守卫口径（2026-09-27 spec 审查 MINOR-2 纠注释）：78 号守卫 3 比的是**四档实质断言任务
  # id 的交集**（实测 15 个）。本档与材料档同 id 的 task-skeleton-contract 因 clinical 改名
  # task-outline-contract 而**掉出交集**，故同样不受同源约束——改它不会打断守卫；反之，落在
  # 交集内的 15 个 id（含 task-select-journal、task-write-results-discussion）单档改断言即破守卫。
  #
  # 形体下限的设计口径（2026-09-27 spec 审查四轮返工后的实测边界）：`contains` 只证明词元在场，
  # "token 挤一行 + 无意义编号行"的填充产物第一轮实测 rc=0（上一轮外部样本标签 M1/M3/M4/B6 未在本仓
  # 留存；本轮同类形态实测仍 rc=0 的是 M-03/M-04/M-08b/M-10），故表类断言再加数字计数与单元格
  # 分隔符计数两道下限（09 是例外，它无 AC 可辩护的数字下限，见该任务行注释）。**这两道只拦得住"格内零数字的裸填充"**：对抗实测 12 例
  # 填充中 M-01（词元挤一行 + 纯编号行，digits=15 / pipes=12）被 `\d` 与 `\|` 两道同时咬死，
  # M-02（表头齐、格内全空，digits=12 / pipes=108）只被 `\d` 咬（外框分隔符已够，`\|` 那档放行）；
  # 而把格内换成无意义数字串（digits=371）、整列复制同一数值、同一条图号复制四行、620 词凑数
  # 即翻转为 rc=0（共 10 例，见档头约束 4）。因此下限定位是"形状材料总量校验"，不是填充判据；
  # 数值是否逐行独立、是否成对出现，全部由 AC 文本判 + 人工审查判（scripts/70-verify.py:151：
  # min_matches 数的是 findall 出现次数，不认列、不认行、不认唯一性）。
  # 阈值的出处纪律（第三轮 MAJOR-1 的教训）：每道下限的数字**必须由该任务 AC 明文写出的条数与
  # 列数推出**，AC 没写的条数一律不得当成判据——上一版拿自己假设的"10 条 baseline"当真源，
  # 实测把 5 条基线的合规核对表判死（`7 matches of '^\|' < min 10`：7 = 5 表体 + 表头 + 分隔行）。
  # 本轮因此把条数写进 AC（baseline ≥5 条 / 消融行 ≥3 行含基准行 / 主结果 ≥3 指标行 × ≥3 比较列）。
  # **对称要求（第四轮 MAJOR-1/2/3 的教训）**：推导出的最小值就是下限的上界，不得在其上再加"保险
  # 余量"——13 表注释自推 18 却设 20，按 AC 字面手写的合规最小表（每格 `8 ± 1`）实测 digits=18 即被杀；
  # 09 的数字下限任何 AC 可辩护值（≤12）都被 `^\|\s*\d+` min 6 隐含、更高就误杀"全部未满足"的诚实登记，
  # 32 的篇幅下限被 AC1 自己的"骨架为准"逃生条款作废。本轮三处的处置：13 回落**取推导值** 18；09 **删除该道**
  # （无可辩护值且分不开空壳与诚实登记）；32 先给 AC2 补上"不少于 5 条"的条数出处、再回落到推导值 10，
  # 篇幅只留无条件成立的上界 3500。
  # 表格形态的出处纪律（第三轮 MAJOR-2）：`^\|` 与 `\|` 计数隐含"每行以竖线起头与收尾"的外框
  # 要求，GFM 允许省略首尾竖线，故该形态必须由 AC 明文规定（写了这句的是 11/13/14/09 **四张**表的 AC），
  # 否则就是拿正则偏好当判据（实测 T2#12：省略外框的 09 表 anchored 命中 0 被杀）。
  # anchored 计数的列契约约束：AC 未声明行号列的两张表（11-analysis 七列、14-table 五列）只准用
  # `^\|`（要求"成表的行"），不得用 `^\|\s*\d+`——后者实测会把方法名/配置名开头的合规行整表判死
  # （R-01/R-03：anchored_num=0）；只有 AC 明列行号的 09 表才用 `^\|\s*\d+`。
  - task: task-skeleton-contract     # AC「02-skeleton 逐节论点/预算」「01-meta 字段与 skeleton 一致」
    files:
      - path: 00-admin/02-skeleton.md
        contains: ["Introduction", "Experimental", "Results", "Conclusion", "预算"]
    json_files:
      - path: 00-admin/01-meta.json
        min_items: 5
        require_keys: ["title", "target_journal", "citation", "word_budget", "figures", "tables"]   # AC2（task-skeleton-contract 第 2 条）明列 5 个字段：标题、目标刊、引用制、字数预算、图表数——其中"图表数"落成 figures + tables 两键，故键要求 6 个；min_items 5 = AC2 那 5 个字段的数量下限（顶层为 dict 时 min_items 检的是**键数**，scripts/70-verify.py:179 与 :183-188；顶层为列表时检条目数）；require_keys 检第 1 个元素应含的键（scripts/70-verify.py:39）
  - task: task-analyze-baselines     # AC「baseline 七列表头逐行核对（表号+页码）」「逐种子值与 mean ± std」
    files:
      - path: 10-data/11-analysis.md
        contains: ["原文", "页码", "复现", "种子"]
        min_matches: { pattern: "^\\|", min: 7 }             # AC1「不少于 5 条 baseline、每行以竖线起头收尾」：5 表体 + 表头 + 分隔行 = 7 个以竖线起头的行；AC 未声明行号列，故只锚"行首有竖线"
      - path: 10-data/11-analysis.md
        min_matches: { pattern: "\\d", min: 30 }             # AC1 的 5 行 × 每行 ≥6 位（原文值/复现值/std/表号页码）
      - path: 10-data/11-analysis.md
        min_matches: { pattern: "\\|", min: 50 }             # AC1 的 5 行 × 每行 8 个分隔（七列 + 外框）＝40，加表头与分隔行 16 ⇒ 56，取 50 留余量
      - path: 10-data/13-table-main-results.md
        contains: ["均值", "标准差"]
        min_matches: { pattern: "\\d", min: 18 }             # AC3「≥3 指标行 × ≥3 比较列」＝9 格，取最弱读法每格 mean 与 std 各 1 位 ⇒ 2 位/格，9×2＝**18**（本轮由 20 回落：20 会把按此读法手写的合规最小表判死，实测 digits=18）；若按 AC3 括注「两位小数」强读法则 ≥36，本档取下界以免误杀，两位小数口径由 AC 文本 + 人工审查判
      - path: 10-data/13-table-main-results.md
        min_matches: { pattern: "\\|", min: 18 }             # AC3 的 3 指标行 + 表头 + 分隔 = 5 行 × 每行 5 个分隔（3 比较列 + 指标列 = 4 列，加外框）＝推导值 **25**，实测合规最小表 pipes=25；声明下限取 25 之下、仍能拦住"每行不足 4 列"的裸填充。上一版注释写"每行 4 个分隔（3 列 + 外框）＝20"是算错（把 AC3 的"3 个比较列"当成全表列数，漏了指标列）
      - path: 40-figures/40-figure-specs.md
        contains: ["误差棒", "坐标轴", "缺失"]
        min_matches: { pattern: "Fig\\. ?\\d+", min: 4 }    # AC「不少于四条图规格」：findall 只数出现次数，重复同一图号凑数不可检（档头约束 4）
  - task: task-declare-reproducibility # AC「六要素表头列（行号/要素/状态/取值与来源/正文定位）逐行登记」+「待确认项收口行恒在」
    files:
      - path: 00-admin/09-reproducibility.md
        contains: ["代码", "随机种子", "超参数", "许可", "状态", "定位", "待确认项"]
        forbid_regex: ["部分满足", "基本满足", "大致满足"]        # AC1 规定状态只能取三态之一；值域外的中间措辞是"把缺项糊过去"的常态写法
        min_matches: { pattern: "^\\|\\s*\\d+", min: 6 }    # AC1 明列「行号 1..6」与外框形态：六要素各行以竖线起头且紧跟行号（下限=要素数，不缺任何一行）
      # 本任务**不设 `\d` 下限**（第四轮 MAJOR-1 删除上一版的 min 24）：AC 可辩护的最小数字位是 12
      # （6 个行号 + 每行定位列 1 位），而它已被上面 `^\|\s*\d+` min 6 完全隐含 ⇒ 取 ≤12 是摆设；
      # 实测「六要素全未满足」的零准备诚实登记 digits=18 被 24 判死，而谎称已满足的空壳只要页码写两位
      # 就是 24 并放行——该道下限只杀合法、不杀非法。数字位分不开二者已由档头约束 4 登记。
      - path: 00-admin/09-reproducibility.md
        min_matches: { pattern: "\\|", min: 30 }            # AC1 的 6 表体 + 表头 + 分隔 = 8 行 × 每行 6 个分隔（五列 + 外框）＝推导值 **48**（上一版"≥5 个分隔…＝40"漏算了首尾外框各一个），实测合规最小表 pipes=48；声明下限取 30（低于推导值 ⇒ 不误杀），真实拦截面是"把词元竖排成单列/行列数不足"的裸表，不是空壳判据
  - task: task-write-implementation  # AC「实现节含 Datasets/Baselines/Implementation/Metrics」
    files:
      - path: 30-manuscript/sections/32-implementation.md
        contains: ["Datasets", "Baselines", "Implementation", "Metrics"]
        word_count: [1, 3500]                               # AC1 原文是「正文篇幅 600–3500 词（`02-skeleton.md` 给本节更小预算时以骨架为准）」——**带逃生条款**，故本轮只保留无条件成立的上界 3500，删掉下界 600：词数原语没有条件语义，骨架给 <600 预算时按 AC 写的合规短节（实测 295 词、482 词）会被判死；"本节不为空"已由通配档 min_bytes 200 兜住。凑词数不可检（档头约束 4）
        min_matches: { pattern: "\\d", min: 10 }            # AC2（第四轮补明文）「每条 baseline 与 11-analysis 同集合、不少于 5 条，各给表号 + 页码」⇒ 5 × 每处出处 ≥2 个数字位＝**10**；上一版的 20 无任何 AC 条数可推（违出处纪律）故回落到推导值。低于 10 即"整节零出处数字"，实测四子节名挤一行 + 650 词凑数的填充（digits=0）被这道咬住
  - task: task-tabulate-ablations    # AC「消融表五列表头逐行给 配置/指标/mean ± std（均值 ± 标准差）/方向/claim」+「图规格含误差棒与连续图号」
    files:
      - path: 10-data/14-table-ablations.md
        contains: ["消融", "标准差", "claim"]
        min_matches: { pattern: "^\\|", min: 5 }             # AC1「不少于 3 个消融行（含完整模型基准行）+ 每行以竖线起头收尾」：3 表体 + 表头 + 分隔 = 5；AC 五列里没有行号列，故只锚行首竖线
      - path: 10-data/14-table-ablations.md
        min_matches: { pattern: "\\d", min: 15 }             # AC1 的 3 表体行 × 每行 ≥5 个数字位（mean 与 std 的数字位 + 指标名里的编号或 claim 号）＝推导值 15；实测合规最小表每行 6 位（`8.4 ± 0.1` + `Top-1` + `C-1`）⇒ digits=18，不误杀。若按 AC1 的 mean/std 写法强读成"两位小数"则每行 ≥21 位，本档取最弱读法的下界，不把余量当判据
      - path: 10-data/14-table-ablations.md
        min_matches: { pattern: "\\|", min: 25 }             # AC1 的 3 表体 + 表头 + 分隔 = 5 行 × 每行 6 个分隔（五列 + 外框）＝30，取 25
      - path: 40-figures/40-figure-specs.md
        contains: ["误差棒", "消融"]
        contains_regex: ["Fig\\.\\s*\\d+"]
        min_matches: { pattern: "Fig\\. ?\\d+", min: 4 }    # AC「不少于四条图规格（含本任务的消融图）」：计数不认唯一性，同图号重复不可检（档头约束 4）

# 规范依赖图（P0–P6 顺序铁律：数据 → 需求单 → 文献 → 撰写 → 合稿 → 评审）。
# CS/ML 特有边：复现声明前置于实现节写作（缺六要素则方法节无法定稿）；
# 消融表前置于主结果写作与数据图重绘（贡献主张的支撑来自消融行）。
depends:
  task-extract-figures: []
  task-audit-data: []
  task-analyze-baselines: [task-audit-data]
  task-declare-reproducibility: [task-audit-data]
  task-claim-map: [task-analyze-baselines]
  task-tabulate-ablations: [task-analyze-baselines, task-skeleton-contract]
  task-skeleton-contract: [task-claim-map, task-select-journal]
  task-screen-existing-refs: []
  task-search-verify-refs: [task-screen-existing-refs, task-claim-map]
  task-lit-fulltext-inventory: [task-search-verify-refs]
  task-select-journal: [task-analyze-baselines, task-search-verify-refs]
  task-write-implementation: [task-skeleton-contract, task-lit-fulltext-inventory, task-declare-reproducibility]
  task-write-results-discussion: [task-write-implementation, task-tabulate-ablations]
  task-write-introduction: [task-write-results-discussion]
  task-write-conclusion-abstract: [task-write-introduction]
  task-redraw-data-figures: [task-analyze-baselines, task-tabulate-ablations]
  task-draw-schematics: [task-skeleton-contract]
  task-compose-raster-figures: [task-extract-figures]
  task-assemble-draft: [task-write-conclusion-abstract, task-redraw-data-figures, task-draw-schematics, task-compose-raster-figures]
  task-citation-audit: [task-assemble-draft, task-lit-fulltext-inventory]
  task-presubmit-review: [task-assemble-draft, task-citation-audit, task-declare-reproducibility]
  task-finalize-manuscript: [task-presubmit-review]
  task-latex-build: [task-finalize-manuscript]

# ── 规范任务集（P1–P6；顺序铁律：框架 → 文献 → 撰写）────────────────────────────
tasks:
  # ── P1 数据基座 ────────────────────────────────────────────────────────────────
  - id: task-extract-figures
    module: mod-data
    stage: P1
    name: 提取既有图件并建清单
    brief: 从原学位论文/技术报告/投稿草稿提取全部图件与表格截图，建可回溯清单。
    ac:
      - "`{fig}/extracted/manifest.md` 列出每张图的来源（文档页/图号/幻灯片号）、导出文件名与像素尺寸，覆盖原始文档中的全部图件。"
      - "导出件存于 `{fig}/extracted/`，文件名与清单一一对应，不重命名、不改色、不裁切。"
      - "`{data}/raw/` 下原始文档保持原样（只读），本任务不修改任何原始件；无既有图件者在清单写明“无来源图件，全部图件由本稿新生成”。"
    read: [{path: "{data}/raw", priority: must_read, hint: 原始报告与图件源}]
    edit: ["{fig}/extracted/manifest.md"]
    hours: 2
    difficulty: low
    verify: "python {verify_tool} task-extract-figures"

  - id: task-audit-data
    module: mod-data
    stage: P1
    name: 核对实验日志与源表数值
    brief: 将训练日志与评测输出逐值核对，登记口径、种子数、算力与缺口清单。
    ac:
      - "`{data}/10-audit.md` 含逐值核对表，覆盖全部日志与指标导出文件，标注每个数值对应的来源文件/运行 ID 及一致/不一致/缺失判定。"
      - "所有不一致或缺失项单列缺口清单（G 编号），并注明是否影响主要结论及处置（保留并 hedging / 不使用）。"
      - "明确每个指标的口径（哪个划分、哪个 checkpoint 选择规则、几种子、聚合方式）与单位；源数据无方差列时显式标注“原文未报告”。"
      - "声明后续分析唯一数据源为 `{data}/`（含 `.provenance` 与运行清单），不引入项目外数据。"
    inject: [unit_source, n_disclosure, raw_vs_processed]
    ac_exception: true            # 4 条产物 AC + 3 条域口径注入（数据来源、种子与口径是 CS/ML 口径的三处硬约束）
    read: [{path: "{data}", priority: must_read, hint: 训练日志与评测输出}, {path: "{data}/raw", priority: must_read, hint: 不可再生的原始件（只读）}]
    edit: ["{data}/10-audit.md"]
    hours: 3
    difficulty: low
    verify: "python {verify_tool} task-audit-data"

  - id: task-analyze-baselines
    module: mod-data
    stage: P1
    name: baseline 原文核对与多种子方差分析
    brief: 出 baseline 原文报告值与本稿复现值的逐行核对表、多种子方差、主结果表与图表规格。
    ac:
      - "baseline 原文核对（page-level）：`{data}/11-analysis.md` 以上述七项为表头列（方法名、指标、他方原文报告值、原文表号与页码、本稿复现值、mean ± std、偏差判定），逐行给一个 baseline 且不少于 5 条，每列各占一格、每行以竖线起头与收尾；与原文不一致者按 G 编号登记缺口，不得改写原文数值以对齐自家结果。"
      - "`{data}/11-analysis.md` 给出每个指标的多种子聚合口径（均值/中位数、样本标准差）与逐种子值（阿拉伯数字，不得写“若干次运行”），且口径与 `{data}/10-audit.md` 一致。"
      - "`{data}/13-table-main-results.md` 主结果表不少于 3 个指标行 × 3 个比较列（本方法 + ≥2 条 baseline），每格给 mean ± std 并可回指日志；本表是中文工作文档，列名与口径逐字写中文 均值 / 标准差（两位小数），每行以竖线起头与收尾；只报最优一次运行的单元格判为不合格。"
      - "`{fig}/40-figure-specs.md` 逐图给类型（曲线/柱状/散点）、坐标轴与单位、误差棒口径、缺失数据不补点的标注方式与图注必写项；条目不少于四条（主比较图、训练曲线、消融图、尺度或效率图），每条以 Fig. <数字> 起头。"
      - "结论不得超出 `{admin}/00-plan.md` 的边界；越界项显式标注为“未测/不主张”。"
    inject: [baseline_provenance, seed_variance, missing_data, forbidden_claims]
    ac_exception: true            # 5 条产物 AC + 4 条域口径注入（原文核对与方差披露必须与缺口、禁用断言同时约束）
    read: [{path: "{data}/10-audit.md", priority: must_read, hint: 口径与缺口清单}, {path: "{admin}/00-plan.md", priority: must_read, hint: 证据路线与边界}]
    edit: ["{data}/11-analysis.md", "{data}/13-table-main-results.md", "{fig}/40-figure-specs.md"]
    hours: 6
    difficulty: high
    verify: "python {verify_tool} task-analyze-baselines"

  - id: task-declare-reproducibility
    module: mod-data
    stage: P1
    name: 复现声明登记（代码/超参/随机种子）
    brief: 逐行核对可复现六要素并以固定收口行声明有无待确认项。
    ac:
      - "`{admin}/09-reproducibility.md` 以编号表格逐行登记六要素，表头列为 行号、要素、状态、取值与来源、正文定位（节 + 页或表图号），每行以竖线起头与收尾；六要素即 行号 1 代码来源与 commit、行号 2 运行环境与框架版本、行号 3 超参数搜索空间与选定值、行号 4 随机种子清单、行号 5 数据划分与版本及许可、行号 6 指标实现出处；状态取 已满足（附取值与来源文件）/ 未满足 / 不适用（写明理由）三态之一。"
      - "本文件末尾必须有「待确认项：」收口行：有缺失者逐条列出（格式 待确认项：<项目>：需谁提供什么），六要素均为 已满足 或 不适用 时写「待确认项：无」——该行不得整句省略，缺项以「不写这行」的形式消失即判不合格。"
      - "随机种子清单必须给出实际使用的种子值与每个种子对应的运行 ID（阿拉伯数字）；只写“固定随机种子”而不给数值者判未满足。"
      - "超参数条目须区分事前设定与搜索所得，并给搜索试验次数；无法核证者判为未满足，不得凭记忆填写。"
      - "六要素的同一口径须出现在 `{ms}/sections/32-implementation.md` 与 `{ms}/39-back-matter.md` 的对应位置，不得静默省略、不得只写 N/A。"
